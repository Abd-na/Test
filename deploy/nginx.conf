# /etc/nginx/sites-available/veta-messenger  (then: ln -s ... sites-enabled/ && nginx -t && systemctl reload nginx)
# SSL: certbot --nginx -d msg.veta.example.com
server {
    listen 80;
    server_name msg.veta.example.com;

    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SMS phones long-poll for up to ~25s
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
}
