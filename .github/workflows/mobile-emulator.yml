name: Android emulator smoke test

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-emulator.yml'
      - '.github/scripts/android-smoke.sh'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore stable signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - run: flutter build apk --release

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: mobile
          script: bash ../.github/scripts/android-smoke.sh build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screens
          path: mobile/screen-*.png
