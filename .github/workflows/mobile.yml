name: Android APK (Flutter)

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Optional: a stable signing key so new versions install over old ones.
      # Add repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      # The SMS engine is native Kotlin: fail if its manifest components (names kept by R8) are missing
      - name: Verify native gateway classes are packaged
        run: |
          unzip -p build/app/outputs/flutter-apk/app-release.apk 'classes*.dex' > all.dex
          for c in MainActivity GatewayService SmsReceiver SmsResultReceiver BootReceiver SmsDeliverReceiver MmsReceiver RespondViaMessageService; do
            grep -qa "Lcom/veta/smsgateway/$c;" all.dex || { echo "missing $c"; exit 1; }
            echo "found $c"
          done
          rm all.dex

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk veta-sms-gateway.apk

      - uses: actions/upload-artifact@v4
        with:
          name: veta-sms-gateway-apk
          path: mobile/veta-sms-gateway.apk
