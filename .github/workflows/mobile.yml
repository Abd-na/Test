name: Android APK (Flutter)

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Every APK must be signed with the SAME key, or Android refuses to install an update
      # over the previous version ("App not installed").
      # Preferred: repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Without them, a key is generated once and cached.
      - name: Use signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Restore cached signing key
        if: env.ANDROID_KEYSTORE_PATH == ''
        uses: actions/cache@v4
        with:
          path: ~/.veta-signing/veta.jks
          key: veta-signing-key-v1

      - name: Use cached signing key (created on first build)
        if: env.ANDROID_KEYSTORE_PATH == ''
        run: |
          mkdir -p ~/.veta-signing
          if [ ! -f ~/.veta-signing/veta.jks ]; then
            keytool -genkeypair -keystore ~/.veta-signing/veta.jks -storepass vetasms-ci -alias veta \
              -keypass vetasms-ci -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Veta SMS,O=Veta,C=IQ"
          fi
          {
            echo "ANDROID_KEYSTORE_PATH=$HOME/.veta-signing/veta.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=vetasms-ci"
            echo "ANDROID_KEY_ALIAS=veta"
            echo "ANDROID_KEY_PASSWORD=vetasms-ci"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: flutter build apk --release

      - name: Verify native gateway classes are packaged
        run: |
          unzip -p build/app/outputs/flutter-apk/app-release.apk 'classes*.dex' > all.dex
          for c in MainActivity GatewayService SmsReceiver SmsResultReceiver BootReceiver SmsDeliverReceiver MmsReceiver RespondViaMessageService; do
            grep -qa "Lcom/veta/smsgateway/$c;" all.dex || { echo "missing $c"; exit 1; }
            echo "found $c"
          done
          rm all.dex

      - name: Show signing certificate (must stay the same between versions)
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -E "SHA-256|DN"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk veta-sms-gateway.apk

      - uses: actions/upload-artifact@v4
        with:
          name: veta-sms-gateway-apk
          path: mobile/veta-sms-gateway.apk
